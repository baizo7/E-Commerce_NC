services:
  # -------------------------------------------------------------
  # 1. Django REST Framework Backend Service
  # -------------------------------------------------------------
  - type: web
    name: modernshop-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn --chdir backend marketplace_core.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 60"
    healthCheckPath: /api/schema/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: modernshop-db
          property: connectionString
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"
      - key: USE_REDIS_CACHE
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"

  # -------------------------------------------------------------
  # 2. React + TypeScript Storefront (Static Site)
  # -------------------------------------------------------------
  - type: web
    name: modernshop-frontend
    env: static
    region: oregon
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: /api/*
        destination: https://modernshop-backend.onrender.com/api/*
      - type: rewrite
        source: /media/*
        destination: https://modernshop-backend.onrender.com/media/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.18.0

databases:
  # -------------------------------------------------------------
  # 3. PostgreSQL Managed Database
  # -------------------------------------------------------------
  - name: modernshop-db
    region: oregon
    plan: free
    databaseName: marketplace_db
    user: postgres
